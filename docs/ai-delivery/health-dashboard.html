<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Delivery Project Health</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { margin: 0; background: #f7f9fc; color: #111827; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: 0; }
    h2 { margin: 28px 0 12px; font-size: 18px; letter-spacing: 0; }
    .status { border: 1px solid #cbd5e1; background: #ffffff; border-radius: 8px; padding: 10px 12px; font-weight: 700; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .metric, .feature { border: 1px solid #d8dee9; background: #ffffff; border-radius: 8px; padding: 14px; }
    .metric span { display: block; color: #64748b; font-size: 13px; margin-bottom: 6px; }
    .metric strong { display: block; font-size: 24px; line-height: 1.1; }
    .feature { margin-bottom: 10px; }
    .feature h3 { margin: 0 0 8px; font-size: 16px; letter-spacing: 0; }
    .feature p { margin: 6px 0; color: #334155; overflow-wrap: anywhere; }
    code { background: #eef2f7; border-radius: 5px; padding: 2px 5px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>AI Delivery Project Health</h1>
        <p>Generated: 2026-07-09</p>
      </div>
      <div class="status">Status: healthy</div>
    </header>
    <section class="summary" aria-label="Project health summary">
      <div class="metric"><span>Features</span><strong>2</strong></div>
      <div class="metric"><span>Healthy</span><strong>2</strong></div>
      <div class="metric"><span>Blocked</span><strong>0</strong></div>
      <div class="metric"><span>Missing Evidence</span><strong>0</strong></div>
      <div class="metric"><span>Stale</span><strong>0</strong></div>
      <div class="metric"><span>Needs Triage</span><strong>0</strong></div>
    </section>
    <section>
      <h2>Top Problems</h2>
      <p class="feature">No project health problems.</p>
    </section>
  </main>
</body>
</html>
