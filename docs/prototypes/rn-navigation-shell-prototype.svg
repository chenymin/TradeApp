<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <style>
      .bg { fill: #f3f5f2; }
      .phone { fill: #ffffff; stroke: #1f2933; stroke-width: 3; }
      .screen { fill: #f7f8f5; }
      .bar { fill: #ffffff; stroke: #dce2dc; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #dce2dc; stroke-width: 1.4; }
      .muted-card { fill: #eef3ef; stroke: #dce2dc; stroke-width: 1; }
      .primary { fill: #1e6b5c; }
      .accent { fill: #2d8a72; }
      .danger { fill: #a33a2d; }
      .line { stroke: #9aa7a0; stroke-width: 2; fill: none; }
      .dash { stroke: #9aa7a0; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .title { fill: #172026; font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h2 { fill: #172026; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #40505a; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #66747c; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .white { fill: #ffffff; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tab { fill: #58666f; font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tab-active { fill: #1e6b5c; font: 800 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #314047; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #51616a; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="980"/>
