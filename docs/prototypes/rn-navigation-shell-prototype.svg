    <text class="h2" x="0" y="0">Flow rules</text>
    <rect class="card" x="0" y="22" rx="8" ry="8" width="300" height="64"/>
    <text class="note" x="18" y="50">Login</text>
    <text class="small" x="18" y="72">Header button or auth-required action</text>

    <path class="line" d="M310 54 H390"/>
    <rect class="card" x="400" y="22" rx="8" ry="8" width="300" height="64"/>
    <text class="note" x="418" y="50">Purchase / Transfer</text>
